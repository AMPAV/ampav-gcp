[project]
name = "ampav-gcp"
dynamic = ["version"]
description = "Google Cloud tooling for the AMPAV environment"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
]
authors = [
    {name = "Ying Feng", email = "yingfeng@iu.edu"},
]

requires-python = ">=3.12"
dependencies = [
    "ampav-core>=0.0.20",
    "google-cloud-language==2.21.0",
    "google-cloud-speech==2.40.0",
    "google-genai==2.20.0",
]

[project.optional-dependencies]
experiments = [
    "google-cloud-storage==3.13.1",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/AMPAV/ampav-gcp"
Repository = "https://github.com/AMPAV/ampav-gcp.git"
Issues = "https://github.com/AMPAV/ampav-gcp/issues"

[tool.setuptools.dynamic]
version = {attr = "ampav.gcp.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ampav*"]
namespaces = true

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
